<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הפקות שיער לימי הולדת</title>
<meta name="description" content="צמות צבעוניות, תסרוקות וקישוטי שיער לימי הולדת – בהתאמה לקונספט שבחרתם. כל משתתפת יוצאת עם שקית מתנה!">
<meta property="og:title" content="יום הולדת עם שיער של כוכבת! 🎀">
<meta property="og:description" content="צמות צבעוניות, תסרוקות וקישוטי שיער בהתאמה לקונספט. כל משתתפת יוצאת עם שקית מתנה!">
<meta property="og:image" content="/bg.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#E8E4E2}
body{font-family:Rubik,sans-serif;color:#5B1035}
.page{position:relative;max-width:480px;min-height:100vh;margin:0 auto;padding:44vw 14px 24px;background:#E8E4E2 url(/bg.png) center top/100% auto no-repeat}
@media(min-width:480px){.page{padding-top:210px}}
.bsd{position:absolute;top:10px;right:14px;font-size:13px;font-weight:700}
.card{background:rgba(255,255,255,.84);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:2px solid #fff;border-radius:26px;box-shadow:0 12px 30px rgba(138,10,75,.15);padding:22px 18px;display:flex;flex-direction:column;gap:18px}
.pill{align-self:flex-start;background:#D10F67;color:#fff;font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px}
.balloon{margin:0;font-family:Fredoka,sans-serif;font-weight:700;font-size:40px;line-height:1.1;background:linear-gradient(180deg,#FFD0E6 0%,#FF5FAE 38%,#E0157A 70%,#9E0F57 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px #fff;filter:drop-shadow(0 2px 0 rgba(138,10,75,.35)) drop-shadow(0 6px 10px rgba(209,15,103,.3))}
.sub{margin:0;font-size:17px;line-height:1.45}
.concept{margin:0;font-family:Fredoka,sans-serif;font-weight:700;font-size:21px;line-height:1.25;color:#6D35D6}
.cat{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:3px solid #D10F67;color:#D10F67;font-family:Fredoka,sans-serif;font-weight:700;font-size:21px;padding:14px 16px;border-radius:18px;cursor:pointer;box-shadow:0 6px 18px rgba(209,15,103,.18);width:100%}
.gift{background:#FFF0F7;border-radius:18px;padding:16px;text-align:center;border:2px dashed #F59AC4}
.gift h3{margin:0 0 6px;font-family:Fredoka,sans-serif;font-weight:700;font-size:21px;color:#D10F67}
.gift p{margin:0;font-size:14px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;background:#D10F67;color:#fff;text-decoration:none;font-weight:700;font-size:22px;padding:16px 20px;border-radius:999px;box-shadow:0 8px 22px rgba(209,15,103,.35)}
.cta:hover{background:#B00C56}
.modal{position:fixed;inset:0;background:rgba(60,5,35,.75);display:none;align-items:center;justify-content:center;padding:14px;z-index:10}
.modal.open{display:flex}
.box{background:#fff;border-radius:20px;padding:12px;width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;gap:8px}
.box header{display:flex;align-items:center;justify-content:space-between}
.box h2{margin:0;font-family:Fredoka,sans-serif;font-size:20px;color:#D10F67}
.close{width:44px;height:44px;border-radius:50%;border:none;background:#FFE4F0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.scroll{overflow:auto;border-radius:12px}
.scroll img{display:block;width:100%;height:auto}
</style>
</head>
<body>
<main class="page">
  <div class="bsd">בס"ד</div>
  <div class="card">
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="pill">הפקות שיער לימי הולדת</div>
      <h1 class="balloon">יום הולדת עם שיער של כוכבת!</h1>
      <p class="sub"><b style="color:#D10F67">צמות צבעוניות</b>, <b style="color:#6D35D6">תסרוקות</b> ו<b style="color:#0B7A7F">קישוטי שיער</b></p>
      <p class="concept">בוחרים קונספט – <span style="color:#D10F67">אנחנו מתאימים את השיער</span></p>
    </div>
    <button class="cat" type="button" id="openCat">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D10F67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      לצפייה בקטלוג התסרוקות
    </button>
    <div class="gift">
      <h3>כל משתתפת יוצאת עם שקית מתנה!</h3>
      <p><b style="color:#6D35D6">מוצרי שיער</b> + <b style="color:#0B7A7F">קישוטי שיער</b> – להמשיך לזרוח גם בבית</p>
    </div>
    <a class="cta" href="https://wa.me/972547750524?text=%D7%94%D7%99%D7%99%21%20%D7%94%D7%92%D7%A2%D7%AA%D7%99%20%D7%9E%D7%93%D7%A3%20%D7%94%D7%A0%D7%97%D7%99%D7%AA%D7%94%20%D7%95%D7%90%D7%A9%D7%9E%D7%97%20%D7%9C%D7%AA%D7%90%D7%9D%20%D7%AA%D7%90%D7%A8%D7%99%D7%9A%20%D7%9C%D7%94%D7%A4%D7%A7%D7%AA%20%D7%A9%D7%99%D7%A2%D7%A8%20%D7%9C%D7%99%D7%95%D7%9D%20%D7%94%D7%95%D7%9C%D7%93%D7%AA%20%F0%9F%8E%80%0A%D7%AA%D7%90%D7%A8%D7%99%D7%9A%20%D7%9E%D7%91%D7%95%D7%A7%D7%A9%3A%0A%D7%92%D7%99%D7%9C%20%D7%99%D7%9C%D7%93%D7%AA%20%D7%99%D7%95%D7%9D%20%D7%94%D7%94%D7%95%D7%9C%D7%93%D7%AA%3A%0A%D7%9E%D7%A1%D7%A4%D7%A8%20%D7%9E%D7%A9%D7%AA%D7%AA%D7%A4%D7%95%D7%AA%3A%0A%D7%A7%D7%95%D7%A0%D7%A1%D7%A4%D7%98%3A" target="_blank" rel="noopener">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
      לקביעת תאריך
    </a>
  </div>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="קטלוג התסרוקות">
  <div class="box">
    <header>
      <h2>קטלוג התסרוקות</h2>
      <button class="close" type="button" id="closeCat" aria-label="סגירת הקטלוג"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D10F67" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="scroll"><img src="/catalog.png" alt="קטלוג תסרוקות לילדות: צמות, פקעות וקוקיות עם קישוטי שיער" loading="lazy"></div>
  </div>
</div>
<script>
var m=document.getElementById('modal');
document.getElementById('openCat').onclick=function(){m.classList.add('open')};
document.getElementById('closeCat').onclick=function(){m.classList.remove('open')};
m.onclick=function(e){if(e.target===m)m.classList.remove('open')};
document.addEventListener('keydown',function(e){if(e.key==='Escape')m.classList.remove('open')});
</script>
</body>
</html>
